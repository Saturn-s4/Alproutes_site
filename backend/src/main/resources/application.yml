spring:
  application:
    name: alproutes
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/alproutes}
    username: ${DB_USER:alproutes}
    password: ${DB_PASSWORD:alproutes}
  flyway:
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: always
    deserialization:
      fail-on-unknown-properties: true

server:
  servlet:
    context-path: /api/v1
  error:
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health

alproutes:
  auth:
    # HS256 secret for our own access tokens, at least 32 bytes. MUST be overridden outside dev.
    jwt-secret: ${JWT_SECRET:}
    issuer: alproutes
    access-token-ttl: 15m
    refresh-token-ttl: 35d
    google-client-ids: ${GOOGLE_CLIENT_IDS:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    # Endpoint put into pre-signed URLs, i.e. as seen by the browser/app.
    public-endpoint: ${S3_PUBLIC_ENDPOINT:http://localhost:9000}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:alproutes-media}
    access-key: ${S3_ACCESS_KEY:alproutes}
    secret-key: ${S3_SECRET_KEY:alproutes-secret}
    path-style: true
    upload-url-ttl: 15m
    public-bucket: ${S3_PUBLIC_BUCKET:alproutes-public}
    public-base-url: ${S3_PUBLIC_BASE_URL:http://localhost:9000/alproutes-public}
    download-url-ttl: 10m
  maintenance:
    # Daily cleanup: expired upload slots, unattached photos, duplicate documents. Server time zone.
    enabled: ${MAINTENANCE_ENABLED:true}
    cron: ${MAINTENANCE_CRON:0 30 3 * * *}
    unattached-photo-ttl: 7d
    duplicate-document-window: 3d
  places:
    # Place search on the map. The public Nominatim server: at most 1 request/s, identify the app
    # (https://operations.osmfoundation.org/policies/nominatim/). Empty URL turns the search off.
    url: ${PLACES_URL:https://nominatim.openstreetmap.org}
    user-agent: ${PLACES_USER_AGENT:AlpRoutes/0.1 (dev)}
    email: ${PLACES_EMAIL:}
    min-interval: ${PLACES_MIN_INTERVAL:1100ms}
