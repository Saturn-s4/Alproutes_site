name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # Testcontainers starts PostGIS and SeaweedFS on the runner's Docker.
      - run: ./gradlew test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/build/reports/tests/test

  db-schema:
    name: DB schema tests
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: alproutes
          POSTGRES_USER: alproutes
          POSTGRES_PASSWORD: alproutes
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U alproutes -d alproutes"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: alproutes
      PGPASSWORD: alproutes
      PGDATABASE: alproutes
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations
        run: >
          docker run --rm --network host -v "$PWD/infra/db/migration:/flyway/sql:ro" flyway/flyway:10
          -url=jdbc:postgresql://localhost:5432/alproutes -user=alproutes -password=alproutes
          -locations=filesystem:/flyway/sql migrate
      - run: psql -v ON_ERROR_STOP=1 -f infra/db/tests/constraints_test.sql
      - run: psql -v ON_ERROR_STOP=1 -f infra/db/tests/postgis_test.sql

  web:
    name: Web typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # typecheck regenerates the API types from shared/openapi.yaml first.
      - run: npm run typecheck
      - run: npm run build
