# Local infrastructure: PostgreSQL 16 + PostGIS 3, SeaweedFS (S3), Flyway for migrations.
#
#   docker compose -f infra/docker-compose.yml up -d                     # db + s3
#   docker compose -f infra/docker-compose.yml run --rm flyway migrate   # apply migrations
#
# Credentials below are for local development only.

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: alproutes
      POSTGRES_USER: alproutes
      POSTGRES_PASSWORD: alproutes
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/tests:/db-tests:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alproutes -d alproutes"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible storage. MinIO images were removed from Docker Hub and Quay (Sept 2026),
  # so local S3 is SeaweedFS. Host port 9000 is kept so backend defaults stay unchanged.
  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    command: >
      server -dir=/data -master.volumeSizeLimitMB=1024
      -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "9000:8333"   # S3 API
    volumes:
      - seaweedfs-data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  # Creates the bucket once SeaweedFS is up.
  s3-init:
    image: chrislusf/seaweedfs:4.47
    depends_on:
      - seaweedfs
    entrypoint: >
      /bin/sh -c "
      until wget -q -O /dev/null http://seaweedfs:8888/; do sleep 1; done;
      echo 's3.bucket.create -name alproutes-media' | weed shell -master=seaweedfs:9333 -filer=seaweedfs:8888;
      "

  # Not started by `up`: run explicitly (see header). The backend will also run
  # Flyway on start-up; this service is for applying/checking migrations without it.
  flyway:
    image: flyway/flyway:10
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    # Connection via env, so any Flyway command can be passed: migrate, info, validate.
    environment:
      FLYWAY_URL: jdbc:postgresql://db:5432/alproutes
      FLYWAY_USER: alproutes
      FLYWAY_PASSWORD: alproutes
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
    command: migrate
    volumes:
      - ./db/migration:/flyway/sql:ro

volumes:
  db-data:
  seaweedfs-data:
