<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Вход и регистрация</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;font-family:'IBM Plex Sans',sans-serif}
.th-dark{--bg:#0A0B0D;--surface:#0E1013;--surface2:#14171C;--raised:#1C1F25;--line:#1F2229;--line2:#2B2F37;--text:#EDEEF0;--text2:#C5C9D0;--muted:#9AA0AA;--faint:#7D838E;--accent:#F08C50;--accent-text:#F6B38A;--accent-soft:rgba(240,140,80,0.14);--on-accent:#0A0B0D;--blue:#2F6BFF;--blue-text:#6FA3FF;--blue-hover:#9CC0FF;--blue-soft:rgba(47,107,255,0.16);--map:#0C0F14;--photo:#151A22;--photo2:#1C2330;--photo3:#2A3444;--overlay:rgba(14,16,19,0.92);color-scheme:dark}
.th-light{--bg:#F5F4F1;--surface:#FFFFFF;--surface2:#F3F2EF;--raised:#E8E6E1;--line:#E4E2DC;--line2:#D3D0C8;--text:#15161A;--text2:#3B3F46;--muted:#5F636B;--faint:#6E727A;--accent:#EE8B52;--accent-text:#B0561F;--accent-soft:rgba(238,139,82,0.16);--on-accent:#15161A;--blue:#2D62E6;--blue-text:#2255D0;--blue-hover:#173FA3;--blue-soft:rgba(45,98,230,0.12);--map:#EDF1F6;--photo:#DDE3EB;--photo2:#C9D2DE;--photo3:#B5C0CF;--overlay:rgba(255,255,255,0.94);color-scheme:light}
.th-dark,.th-light{background:var(--bg);color:var(--text)}
.th-dark a,.th-light a{color:var(--blue-text);text-decoration:none}.th-dark a:hover,.th-light a:hover{color:var(--blue-hover)}
input::placeholder,textarea::placeholder{color:var(--faint)}
button,input{font-family:inherit}
</style>
</helmet>
<div class="{{themeClass}}" style="width: 1600px; height: 900px; display: flex; overflow: hidden; background: var(--bg)">

<section style="width: 760px; flex-shrink: 0; position: relative; background: var(--map); overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; padding: 40px 48px; box-sizing: border-box">
<svg viewBox="0 0 760 900" preserveAspectRatio="xMidYMid slice" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%">
<g fill="none" stroke-width="1" style="stroke: var(--blue)" stroke-opacity="0.4">
<ellipse cx="470" cy="420" rx="34" ry="20" transform="rotate(-24 470 420)"></ellipse>
<ellipse cx="464" cy="428" rx="72" ry="46" transform="rotate(-24 470 420)"></ellipse>
<ellipse cx="456" cy="438" rx="116" ry="76" transform="rotate(-22 470 420)"></ellipse>
<ellipse cx="446" cy="450" rx="166" ry="110" transform="rotate(-20 470 420)"></ellipse>
<ellipse cx="434" cy="464" rx="222" ry="150" transform="rotate(-18 470 420)"></ellipse>
<ellipse cx="420" cy="480" rx="284" ry="194" transform="rotate(-16 470 420)"></ellipse>
<ellipse cx="404" cy="498" rx="352" ry="242" transform="rotate(-14 470 420)"></ellipse>
<ellipse cx="386" cy="518" rx="426" ry="296" transform="rotate(-12 470 420)"></ellipse>
</g>
<path d="M170 860 C230 760 300 700 340 620 S420 500 470 420" fill="none" stroke-width="3" stroke-linecap="round" style="stroke: var(--accent)"></path>
<circle cx="470" cy="420" r="9" style="fill: var(--accent)"></circle>
</svg>
<div style="position: relative; display: flex; align-items: center; gap: 10px">
<svg width="30" height="30" viewBox="0 0 26 26" fill="none"><path d="M2 22 L10 8 L14 14 L17 10 L24 22 Z" stroke-width="2" stroke-linejoin="round" style="stroke: var(--accent)"></path></svg>
<span style="font-family: Unbounded, sans-serif; font-weight: 700; font-size: 18px; color: var(--text)">ALPROUTES</span>
</div>
<div style="position: relative; display: flex; flex-direction: column; gap: 16px; max-width: 520px">
<h1 style="margin: 0; font-family: Unbounded, sans-serif; font-weight: 700; font-size: 40px; line-height: 1.15; color: var(--text)">Маршруты, треки и описания — в одном каталоге</h1>
<p style="margin: 0; font-size: 17px; line-height: 1.55; color: var(--text2)">Карта, GPX, архивные PDF и живые отзывы тех, кто ходил недавно. Работает в браузере и в приложении на Android.</p>
</div>
</section>

<section style="flex-grow: 1; position: relative; display: flex; align-items: center; justify-content: center">
<div style="position: absolute; top: 24px; right: 32px; display: flex; gap: 10px; align-items: center">
<div role="group" aria-label="Язык интерфейса" style="display: flex; gap: 2px; padding: 3px; border: 1px solid var(--line2); border-radius: 8px; font-family: 'JetBrains Mono', monospace; font-size: 12px">
<button aria-pressed="{{ruOn}}" onClick="{{setRu}}" style="height: 28px; min-width: 34px; padding: 0 8px; border: 0; border-radius: 6px; background: {{ruBg}}; color: {{ruFg}}; cursor: pointer">RU</button>
<button aria-pressed="{{enOn}}" onClick="{{setEn}}" style="height: 28px; min-width: 34px; padding: 0 8px; border: 0; border-radius: 6px; background: {{enBg}}; color: {{enFg}}; cursor: pointer">EN</button>
</div>
<button aria-label="Переключить тему" onClick="{{toggleTheme}}" style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 8px; border: 1px solid var(--line2); background: transparent; color: var(--text2); display: flex; align-items: center; justify-content: center; cursor: pointer">
<sc-if value="{{isDark}}" hint-placeholder-val="{{true}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></sc-if>
<sc-if value="{{isLight}}" hint-placeholder-val="{{false}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"></path></svg></sc-if>
</button>
</div>

<form style="width: 420px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; gap: 4px; padding: 4px; border-radius: 10px; background: var(--surface2); font-size: 15px">
<button type="button" style="flex-grow: 1; height: 40px; border: 0; border-radius: 8px; background: var(--surface); color: var(--text); font-weight: 600; box-shadow: 0 0 0 1px var(--line)">Вход</button>
<button type="button" style="flex-grow: 1; height: 40px; border: 0; border-radius: 8px; background: transparent; color: var(--muted)">Регистрация</button>
</div>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--text2)">Эл. почта
<input type="email" placeholder="name@example.com" style="height: 48px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line2); background: var(--surface); color: var(--text); font-size: 15px; outline: none">
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--text2)">
<span style="display: flex; justify-content: space-between">Пароль <a href="#" style="font-size: 13px">Забыли пароль?</a></span>
<input type="password" value="password" style="height: 48px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--accent); background: var(--surface); color: var(--text); font-size: 15px; outline: none; box-shadow: 0 0 0 3px var(--accent-soft)">
</label>
<label style="display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--text2)"><input type="checkbox" checked style="width: 18px; height: 18px; accent-color: var(--accent)">Запомнить меня</label>
<button type="submit" style="height: 50px; border: 0; border-radius: 8px; background: var(--accent); color: var(--on-accent); font-weight: 600; font-size: 16px">Войти</button>
<div style="display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--faint)"><span style="flex-grow: 1; height: 1px; background: var(--line)"></span>или<span style="flex-grow: 1; height: 1px; background: var(--line)"></span></div>
<button type="button" style="height: 46px; border-radius: 8px; border: 1px solid var(--line2); background: transparent; color: var(--text); font-size: 15px">Продолжить через Google</button>
<button type="button" style="height: 46px; border-radius: 8px; border: 1px solid var(--line2); background: transparent; color: var(--text); font-size: 15px">Продолжить через VK ID</button>
<p style="margin: 0; font-size: 13px; line-height: 1.5; color: var(--muted)">Каталог и треки доступны без входа. Аккаунт нужен, чтобы добавлять маршруты, отзывы и собирать избранное.</p>
</form>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"lang":{"editor":"enum","options":["ru","en"],"default":"ru"},"$preview":{"width":1600,"height":900}}'>
class Component extends DCLogic {
themeVals() {
const s = this.state || {};
const theme = s.theme || this.props.theme || 'dark';
const lang = s.lang || this.props.lang || 'ru';
return {
themeClass: 'th-' + theme, isDark: theme === 'dark', isLight: theme !== 'dark',
toggleTheme: () => this.setState({theme: theme === 'dark' ? 'light' : 'dark'}),
setRu: () => this.setState({lang: 'ru'}), setEn: () => this.setState({lang: 'en'}),
ruBg: lang === 'ru' ? 'var(--raised)' : 'transparent', enBg: lang === 'en' ? 'var(--raised)' : 'transparent',
ruFg: lang === 'ru' ? 'var(--text)' : 'var(--muted)', enFg: lang === 'en' ? 'var(--text)' : 'var(--muted)',
ruOn: lang === 'ru', enOn: lang === 'en'
};
}
renderVals() {
return { ...this.themeVals() };
}
}
</script>
</body>
</html>
